<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 14 44 42" role="img" aria-label="Baja">
  <title>Baja</title>
  <style>
    /* Black on a light background, white on a dark one. A browser applies this inside an
       SVG loaded as an image, so one file is the tab icon in both themes rather than a
       black mark that vanishes on a dark tab strip. */
    svg { color: #111; }
    @media (prefers-color-scheme: dark) { svg { color: #fff; } }
  </style>
<g fill="currentColor">
    <!-- A cypress in one colour and as few pieces as it can be made of: a leaning trunk,
         two limbs of different lengths, a crown that is wide and flat and trails downwind,
         and the ground. No second tone, no rock, no cracks. This one has to work at 16
         pixels in a tab and in one ink on a letterhead, which is what simple has to mean
         here. The asymmetry is the whole point: two limbs of the same length read as a
         wine glass, which is what the first attempt looked like. -->
    <path d="M26.8 51 C27.6 45.4 28.6 40.6 30.2 35.6 L33.6 36.6 C32.2 41.2 31.2 46 30.6 51 Z"/>
    <path d="M30.8 36 C28.4 34 25.6 32.6 22.4 31.6 L21.9 33.4 C24.8 34.4 27.3 35.8 29.6 37.8 Z"/>
    <path d="M31.8 35.2 C36.4 32.4 42.4 30.6 49.6 29.8 L49.8 31.8 C43.4 32.8 38.2 34.6 34.2 37.4 Z"/>
    <path d="
      M19.8 27.6
      C17.4 26.6 17.8 24.4 20.6 23.7 C22.4 23.2 24.2 23.4 25.4 24
      C26.2 21.8 28.8 20.4 31.6 20.1 C33 18.3 36 17.5 38.4 18.3
      C40.2 16.8 43.4 16.8 45.2 18.4 C48.2 18.2 50.9 19.4 51.8 21.2
