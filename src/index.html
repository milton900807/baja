<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <meta name="google" value="notranslate">
  <title>BajaBio GeneTx Designer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="./assets/logos/baja-logo.png">
  <!-- Material Icons, Material Symbols Outlined and Audiowide, served from this box.
       They used to be four stylesheets from fonts.googleapis.com; when that host does
       not resolve the icons never arrive and every button prints its ligature name as
       a word. assets/fonts/icons.css carries the same faces and the same class names.
       Nothing here leaves the origin. -->
  <link rel="preload" href="assets/fonts/material-icons.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/icons.css">
  <script src="assets/env.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- The PayPal SDK used to load here on every page. Payments are Stripe-only now, so
       the third-party script is gone rather than loaded and unused. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: var(--app-bg, #ffffff);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    app-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--app-bg, #ffffff);
    }

    /* Center only the initial loading GIF */
    app-root>img {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(20vw, 200px);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
    }

    /* Make the Angular app component fill app-root */
    app-root> :not(img) {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
  </style>
</head>

<body>
  <!-- <app-redirect> removed: MsalRedirectComponent is no longer bootstrapped (MSAL disabled; app uses OIDC). -->
  <app-root>
    <img src="assets/socal-loading.gif" alt="Loading...">
  </app-root>
</body>


</html>
