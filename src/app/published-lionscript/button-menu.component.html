<div class="button-menu">
  <div *ngIf="title" class="button-menu__title">{{ title }}</div>

  <div class="button-menu__grid">
    <button *ngFor="let b of buttons" type="button" class="circle-btn"
      [style.background]="b.color || null"
      [attr.title]="b.tooltip || b.label || ''"
      (click)="click(b)" (mouseenter)="hover(b)">
      <span *ngIf="b.icon" class="material-icons circle-btn__icon">{{ b.icon }}</span>
      <span *ngIf="b.iconSymbol" class="material-symbols-outlined circle-btn__icon">{{ b.iconSymbol }}</span>
      <!-- The label sits WITH the icon rather than instead of it. Every other button in this
           row is text, so an icon-only one would read as a different kind of control. -->
      <span *ngIf="b.label" class="circle-btn__label">{{ b.label }}</span>
      <!-- A live count, when the button carries one. Rendered only when non-empty, so a
           button with nothing to report shows no empty bubble. -->
      <span *ngIf="b.badge" class="circle-btn__badge">{{ b.badge }}</span>
    </button>
  </div>
</div>
