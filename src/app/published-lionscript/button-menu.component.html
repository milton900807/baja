<div class="button-menu">
  <div *ngIf="title" class="button-menu__title">{{ title }}</div>

  <div class="button-menu__grid">
    <ng-container *ngFor="let b of buttons">

      <!-- A COMMAND INPUT, not a button. The toolbar's main control is a text field: the
           operations behind the icons are reachable by name, so the bar is mostly this.
           The typed text is written back onto the SAME item object the caller handed us
           (b.value) before the ion-function fires, which is how the caller reads it --
           button-menu binds the array it was given, so the object identity is shared. -->
      <div *ngIf="b.type === 'input'" class="menu-input">
        <input
          class="menu-input__field"
          type="text"
          [attr.placeholder]="b.placeholder || b.label || ''"
          [attr.aria-label]="b.label || 'Command'"
          [(ngModel)]="b.value"
          (keydown)="inputKey($event, b)"
          (keydown.escape)="closeMenu()"
          (focus)="closeMenu()" />
        <button type="button" class="menu-input__go" (click)="submit(b)">{{ b.goLabel || 'Go' }}</button>
      </div>

      <!-- A MENU of other buttons. Each entry is an ordinary button item, so a menu is a
           way of GROUPING what is already here rather than a second kind of thing. -->
      <div *ngIf="b.type === 'menu'" class="menu-wrap">
        <button type="button" class="circle-btn circle-btn--menu"
          [class.circle-btn--open]="openMenu === b"
          [attr.title]="b.tooltip || b.label || ''"
          [attr.aria-expanded]="openMenu === b"
          (click)="toggleMenu(b)">
          <span *ngIf="b.icon" class="material-icons circle-btn__icon">{{ b.icon }}</span>
          <span *ngIf="b.iconSymbol" class="material-symbols-outlined circle-btn__icon">{{ b.iconSymbol }}</span>
          <span *ngIf="!b.icon && !b.iconSymbol" class="circle-btn__label">{{ b.label }}</span>
        </button>
        <div *ngIf="openMenu === b" class="menu-pop">
          <div class="menu-pop__title">{{ b.label }}</div>
          <button *ngFor="let it of b.items" type="button" class="menu-pop__item"
            [disabled]="it.disabled" (click)="pick(it)">
            <span *ngIf="it.icon" class="material-icons menu-pop__icon">{{ it.icon }}</span>
            <span *ngIf="it.iconSymbol" class="material-symbols-outlined menu-pop__icon">{{ it.iconSymbol }}</span>
            <span class="menu-pop__text">
              <span class="menu-pop__label">{{ it.label }}</span>
              <span *ngIf="it.tooltip" class="menu-pop__hint">{{ it.tooltip }}</span>
            </span>
            <span *ngIf="it.badge" class="circle-btn__badge">{{ it.badge }}</span>
          </button>
        </div>
      </div>

      <!-- An ordinary button. Unchanged: an item with no `type` is what every existing
           caller passes, and it still renders exactly as it did. -->
      <button *ngIf="!b.type" type="button" class="circle-btn"
        [style.background]="b.color || null"
        [attr.title]="b.tooltip || b.label || ''"
        (click)="click(b)" (mouseenter)="hover(b)">
        <span *ngIf="b.icon" class="material-icons circle-btn__icon">{{ b.icon }}</span>
        <span *ngIf="b.iconSymbol" class="material-symbols-outlined circle-btn__icon">{{ b.iconSymbol }}</span>
        <!-- Icons only. The label is the FALLBACK for a button that has no icon, never a
             caption beside one -- the toolbar reads as a row of marks, and the name is on the
             tooltip (see [attr.title] above), which is also what a screen reader announces. -->
        <span *ngIf="!b.icon && !b.iconSymbol" class="circle-btn__label">{{ b.label }}</span>
        <!-- A live count, when the button carries one. Rendered only when non-empty, so a
             button with nothing to report shows no empty bubble. -->
        <span *ngIf="b.badge" class="circle-btn__badge">{{ b.badge }}</span>
      </button>

    </ng-container>
  </div>

  <!-- WHERE A COMMAND'S ANSWER GOES. The caller renders into this element rather than
       opening a window of its own: an answer about what is on the canvas belongs under
       the box it was asked in, and a modal it spawned sat on top of whatever the command
       then opened. Empty means hidden (see :empty in the stylesheet), so it costs nothing
       until something is put in it. -->
  <div #inputResults class="menu-input__results"></div>
</div>
